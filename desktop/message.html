<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <title>YAB</title>
  <style>
    :root { color-scheme: light dark; font: 14px 'Microsoft YaHei UI', sans-serif; color: #202020; background: #fff;
      --line: #ddd; --button: #f3f3f3; --accent: #0067c0; --on-accent: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; }
    main { height: 100%; display: flex; flex-direction: column; }
    section { flex: 1; min-height: 0; padding: 24px; overflow-y: auto; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 14px; overflow-wrap: anywhere; }
    p { margin: 0; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    [hidden] { display: none !important; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 13px; }
    .checkbox input { width: 16px; height: 16px; accent-color: var(--accent); }
    footer { flex-shrink: 0; border-top: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
    button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--button); border-radius: 5px; padding: 7px 18px; min-width: 84px; cursor: pointer; }
    button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:hover { filter: brightness(.93); }
    @media (prefers-color-scheme: dark) {
      :root { background: #202020; color: #f0f0f0; --line: #444; --button: #333; --accent: #60cdff; --on-accent: #17232b; }
    }
    @media (forced-colors: active) {
      :root { background: Canvas; color: CanvasText; --line: ButtonText; --button: ButtonFace; --accent: Highlight; --on-accent: HighlightText; }
    }
  </style>
  <script src="message-page.js" defer></script>
</head>
<body><main role="alertdialog" aria-modal="true" aria-labelledby="message" aria-describedby="detail">
  <section><h1 id="message"></h1><p id="detail"></p><label id="remember-row" class="checkbox" hidden><input id="remember" type="checkbox"><span id="remember-label"></span></label></section><footer id="buttons"></footer>
</main></body>
</html>
