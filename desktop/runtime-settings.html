<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';">
  <title>运行环境</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #0f1115; color: #e6e8ec; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 23px; }
    p { color: #9fa8b8; margin: 0 0 20px; }
    label { display: block; margin: 16px 0 7px; }
    select, input, button { font: inherit; border: 1px solid #374151; border-radius: 7px; color: inherit; background: #1b202b; padding: 9px 12px; }
    select, input { width: 100%; min-width: 0; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #76aaff; outline-offset: 2px; }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    .row input { flex: 1; }
    .note { margin-top: 8px; font-size: 12px; }
    .location-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    #tool-version { color: #9fa8b8; font-size: 12px; white-space: nowrap; }
    input:read-only { color: #bcc9dc; }
    #status { margin-top: 6px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status:empty { display: none; }
    #status.error { color: #ff9d9d; }
    footer { display: flex; justify-content: flex-end; margin-top: 22px; }
    #save { background: #2563be; border-color: #477dcc; padding-inline: 24px; }
    @media (max-width: 600px) { body { padding: 20px; } }
    @media (forced-colors: active) { #save { background: ButtonFace; color: ButtonText; } }
  </style>
  <script src="runtime-settings-page.js" defer></script>
</head>
<body>
  <h1>运行环境</h1>
  <p id="intro">轻量包首次启动需要下载解释器和依赖，识别程序及模型已内置。</p>
  <label for="tool">uv（依赖管理工具）</label>
  <select id="tool">
    <option value="bundled">使用内置工具</option>
    <option value="system">使用系统工具</option>
    <option value="custom">选择本地工具</option>
  </select>
  <div class="row"><button id="detect" type="button">定位系统工具</button><button id="browse" type="button">选择本地文件</button></div>
  <div class="location-heading"><label for="location">工具位置</label><span id="tool-version"></span></div>
  <input id="location" type="text" placeholder="选择本地文件，或填写完整位置" autocomplete="off" spellcheck="false" aria-describedby="tool-version status">
  <div id="status" role="status" aria-live="polite"></div>
  <label for="index">依赖下载源</label>
  <select id="index"></select>
  <p class="note">下载源仅影响依赖；解释器由 uv（依赖管理工具）下载。依赖版本和文件摘要按发行包锁定。</p>
  <footer><button id="save" type="button" disabled>保存并继续</button></footer>
</body>
</html>
