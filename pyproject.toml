[project]
name = "yab"
version = "1.4.3"
description = "用于实现蔚蓝档案自动化"
authors = [{ name = "pur1fying", email = "2274916027@qq.com" }]
dependencies = [
    "lmdb",
    "numpy < 2.0",
    "av == 12.0.0",
    "imgaug",
    "win11toast; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    "adbutils == 2.2.1",
    "uiautomator2 == 2.16.23",
    "opencv-python == 4.8.1.78",
    "starlette >= 0.37.2, < 1.0",
    "uvicorn[standard] >= 0.30.6",
    "requests",
    "dulwich",
    "psutil",
    "tqdm",
    "tomli == 2.2.1",
    "tomli_w == 1.2.0",
    "PyAutoGUI == 0.9.54",
    "mss == 10.0.0",
    "rich >= 14.2.0",
    # 旧安卓连接库仍使用 pkg_resources。
    "setuptools < 70"
]
requires-python = ">=3.9,<3.13"
readme = "README.md"
license = { text = "GPL-3.0-only" }

[dependency-groups]
# 仅保留给旧版冻结打包脚本，桌面发行不安装此组。
legacy-build = ["pyinstaller"]
